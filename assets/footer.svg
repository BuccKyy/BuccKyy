<svg width="1000" height="70" viewBox="0 0 1000 70" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular','Consolas',Menlo,monospace">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="fl" d="M0,35 L430,35 L445,35 L458,12 L470,52 L481,35 L560,35 L1000,35"/>
  </defs>
  <use href="#fl" stroke="url(#fade)" stroke-width="2" filter="url(#g)"/>
  <circle r="3.5" fill="#e0fdff" filter="url(#g)">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#fl"/></animateMotion>
  </circle>
  <text x="500" y="66" text-anchor="middle" fill="#475569" font-size="11" letter-spacing="3">KEEP THE SIGNAL CLEAN</text>
</svg>
