<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SFMono-Regular','Consolas','Liberation Mono',Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="ppg" d="M0,185 L40,185 L55,185 L70,120 L85,170 L98,155 L112,185
      L220,185 L235,185 L250,120 L265,170 L278,155 L292,185
      L410,185 L425,185 L440,120 L455,170 L468,155 L482,185
      L600,185 L615,185 L630,120 L645,170 L658,155 L672,185
      L790,185 L805,185 L820,120 L835,170 L848,155 L862,185
      L1000,185"/>
    <style>
      .name  { fill:#f0fdff; font-size:52px; font-weight:700; letter-spacing:2px; }
      .tag   { fill:#5eead4; font-size:17px; letter-spacing:4px; }
      .mono  { fill:#64748b; font-size:12px; letter-spacing:2px; }
      .bpm   { fill:#22d3ee; font-size:15px; font-weight:700; letter-spacing:1px; }
      @keyframes flow { to { stroke-dashoffset:-32; } }
      @keyframes beat { 0%,100%{transform:scale(1)} 12%{transform:scale(1.35)} 24%{transform:scale(1)} }
      @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0.25} }
      .grid  { stroke:#164e63; stroke-opacity:0.35; stroke-width:1; }
      .march { stroke-dasharray:2 6; animation:flow 1.6s linear infinite; }
      .heart { transform-origin:930px 46px; animation:beat 1.1s ease-in-out infinite; }
      .rec   { animation:blink 1.1s steps(1) infinite; }
    </style>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>

  <!-- ECG grid -->
  <g class="grid">
    <line x1="0" y1="40"  x2="1000" y2="40"/>
    <line x1="0" y1="80"  x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="280" y1="0" x2="280" y2="240"/>
    <line x1="440" y1="0" x2="440" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="760" y1="0" x2="760" y2="240"/>
    <line x1="920" y1="0" x2="920" y2="240"/>
  </g>

  <ellipse cx="360" cy="150" rx="420" ry="120" fill="url(#halo)"/>

  <!-- PPG waveform -->
  <use href="#ppg" stroke="#0e5a6b" stroke-width="5" opacity="0.5"/>
  <use href="#ppg" stroke="url(#trace)" stroke-width="2.5" filter="url(#glow)" stroke-linejoin="round"/>
  <use href="#ppg" class="march" stroke="#e0fdff" stroke-width="2"/>

  <!-- traveling scan pulse -->
  <circle r="4.5" fill="#e0fdff" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#ppg"/>
    </animateMotion>
  </circle>

  <!-- title block -->
  <text class="name" x="46" y="86">BuccKyy</text>
  <text class="tag"  x="48" y="116">CUFFLESS  BP  ·  PPG  ·  EDGE  AI</text>
  <text class="mono" x="48" y="216">SIGNAL &#8594; MODEL &#8594; FIRMWARE &#8594; APP</text>

  <!-- monitor HUD -->
  <g class="heart">
    <path d="M930,40 C927,35 919,36 920,44 C920.5,49 926,53 930,57 C934,53 939.5,49 940,44 C941,36 933,35 930,40 Z" fill="#22d3ee"/>
  </g>
  <text class="bpm"  x="812" y="86">72 BPM</text>
  <circle class="rec" cx="820" cy="112" r="4" fill="#f43f5e"/>
  <text class="mono" x="832" y="116">REC · PPG MONITOR</text>
</svg>
