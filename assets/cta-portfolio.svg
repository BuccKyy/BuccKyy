<svg xmlns="http://www.w3.org/2000/svg" width="560" height="84" viewBox="0 0 560 84" role="img" aria-label="Enter portfolio">
<style>
@font-face{font-family:BC;src:url(data:font/ttf;base64,)}
.t{font-family:BC,'Arial Narrow',sans-serif;font-size:30px;letter-spacing:.32em;fill:#EAEAEA}
.s{font-family:BC,'Arial Narrow',sans-serif;font-size:12px;letter-spacing:.3em;fill:#7FE7FF}
.sweep{animation:sw 3.2s linear infinite}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes sw{from{transform:translateX(-80px)}to{transform:translateX(640px)}}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00A0E9" stop-opacity=".0"/><stop offset=".5" stop-color="#7FE7FF" stop-opacity=".28"/><stop offset="1" stop-color="#00A0E9" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="558" height="82"/></clipPath>
</defs>
<rect x="1" y="1" width="558" height="82" fill="#00041C" stroke="#8FA3B5" stroke-opacity=".5"/>
<g clip-path="url(#c)"><rect class="sweep" x="0" y="0" width="80" height="84" fill="url(#g)"/></g>
<path d="M1 14V1H14M546 1H559V14M559 70V83H546M14 83H1V70" fill="none" stroke="#7FE7FF" stroke-width="2"/>
<circle class="pulse" cx="34" cy="42" r="5" fill="#7FE7FF"/>
<text class="s" x="52" y="30">SEC.00 // LAUNCH</text>
<text class="t" x="52" y="62">ENTER PORTFOLIO</text>
<path d="M500 30l22 12-22 12" fill="none" stroke="#AEB8F0" stroke-width="3"/>
</svg>